name: UI certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: "@k2b/ui"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck package
        run: bun run --cwd packages/ui typecheck

      - name: Verify migration inventory
        run: bun run --cwd packages/ui check:migration

      - name: Build and test package
        run: bun run --cwd packages/ui test

      - name: Typecheck standalone fixture
        run: bun run --cwd packages/ui fixture:typecheck

      - name: Build standalone fixture
        run: bun run --cwd packages/ui fixture:build

  catalog:
    name: Fibel UI catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build @k2b/ui assets
        run: bun run --cwd packages/ui build

      - name: Install Fibel documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Verify UI catalog
        run: bun run --cwd docs-site check:ui-catalog

      - name: Typecheck Fibel documentation
        run: bun run --cwd docs-site typecheck

      - name: Build Fibel documentation
        env:
          CLOUD_DOCS_SITE_URL: http://localhost:3000
        run: bun run --cwd docs-site build
