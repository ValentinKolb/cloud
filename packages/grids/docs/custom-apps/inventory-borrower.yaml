schemaVersion: 4
kind: grids.custom-app
id: 30000000-0000-4000-8000-000000000101
baseId: 30000000-0000-4000-8000-000000000001
name: Inventory lending
icon: package
startPageId: inventory
sidebar:
  actions:
    - id: new-loan
      kind: form
      label: New loan
      icon: plus
      tone: success
      formId: 30000000-0000-4000-8000-000000000501
      fixedValues: {}
      onSuccessNavigate:
        kind: navigate
        pageId: loan
        params:
          loan_id: { source: RESULT, path: recordId }
pages:
  - id: inventory
    title: Inventory
    navigation:
      visible: true
      icon: package
    parameters: {}
    rows:
      - id: inventory
        columns:
          - id: content
            span: 12
            blocks:
              - id: guidance
                type: markdown
                markdown: |
                  ## Find equipment
                  Browse the equipment catalogue, or use **New loan** in the sidebar to start a request for a specific period.
              - id: available-items
                type: records
                searchable: true
                pageSize: 25
                emptyText: No equipment is currently listed.
                source:
                  kind: view
                  viewId: 30000000-0000-4000-8000-000000000403
                display:
                  kind: table
                  columnIds:
                    - 30000000-0000-4000-8000-000000000301
                    - 30000000-0000-4000-8000-000000000302
                    - 30000000-0000-4000-8000-000000000303

  - id: loans
    title: My loans
    navigation:
      visible: true
      icon: clipboard-list
    parameters: {}
    rows:
      - id: loans
        columns:
          - id: content
            span: 12
            blocks:
              - id: loans
                type: records
                searchable: true
                pageSize: 25
                source:
                  kind: view
                  viewId: 30000000-0000-4000-8000-000000000401
                display:
                  kind: table
                  columnIds:
                    - 30000000-0000-4000-8000-000000000306
                    - 30000000-0000-4000-8000-000000000304
                    - 30000000-0000-4000-8000-000000000305
                rowNavigate:
                  kind: navigate
                  pageId: loan
                  history: push
                  params:
                    loan_id: { source: ROW, path: id }

  - id: loan
    title: Loan detail
    navigation:
      visible: false
    parameters:
      loan_id:
        type: record
        tableId: 30000000-0000-4000-8000-000000000201
        required: true
    record:
      tableId: 30000000-0000-4000-8000-000000000201
      id: { source: PARAMS, path: loan_id }
    rows:
      - id: detail
        columns:
          - id: loan
            span: 8
            blocks:
              - id: loan
                type: record
                fieldIds:
                  - 30000000-0000-4000-8000-000000000306
                  - 30000000-0000-4000-8000-000000000304
                  - 30000000-0000-4000-8000-000000000305
                  - 30000000-0000-4000-8000-000000000307
                editableFieldIds:
                  - 30000000-0000-4000-8000-000000000304
                  - 30000000-0000-4000-8000-000000000305
                documents:
                  templateIds:
                    - 30000000-0000-4000-8000-000000000601
                    - 30000000-0000-4000-8000-000000000602
              - id: loan-items
                type: records
                searchable: true
                pageSize: 25
                title: Requested items
                source:
                  kind: gql
                  query: |
                    from table "Loan items"
                    select Item, "Condition on return", "Damage note"
                    where Loan = @params.loan_id
                    sort record.createdAt asc
                    limit 100
                display:
                  kind: table
                  columnIds:
                    - 30000000-0000-4000-8000-000000000308
                    - 30000000-0000-4000-8000-000000000309
                    - 30000000-0000-4000-8000-000000000310
          - id: discussion
            span: 4
            blocks:
              - id: comments
                type: comments
              - id: actions
                type: actions
                actions:
                  - id: add-item
                    label: Add item
                    icon: plus
                    kind: navigate
                    pageId: add-item
                    history: push
                    params:
                      loan_id: { source: RECORD, path: id }
                  - id: finalize
                    label: Finalize request
                    icon: check
                    kind: workflow
                    launcherId: 30000000-0000-4000-8000-000000000701
                    inputs:
                      loan_id: { source: RECORD, path: id }
                    availableWhen:
                      query: |
                        from table Loans
                        where record.id = @params.loan_id and {30000000-0000-4000-8000-000000000306} = 'Draft'
                        limit 1

  - id: add-item
    title: Add item
    navigation:
      visible: false
    parameters:
      loan_id:
        type: record
        tableId: 30000000-0000-4000-8000-000000000201
        required: true
    record:
      tableId: 30000000-0000-4000-8000-000000000201
      id: { source: PARAMS, path: loan_id }
    rows:
      - id: item
        columns:
          - id: content
            span: 12
            blocks:
              - id: loan-context
                type: record
                fieldIds:
                  - 30000000-0000-4000-8000-000000000306
                  - 30000000-0000-4000-8000-000000000304
                  - 30000000-0000-4000-8000-000000000305
                editableFieldIds: []
              - id: available-items
                type: records
                searchable: true
                pageSize: 25
                emptyText: No equipment is available for this loan period.
                source:
                  kind: gql
                  query: |
                    from table "Availability windows" as availability
                    left join table Items as item on Item = item.id
                    select item.id as item_id, item.Name as name, item.Category as category, item.Description as description
                    where Available = true and record.id = @params.loan_id
                    sort name asc
                    limit 100
                display:
                  kind: table
                  columnIds:
                    - 30000000-0000-4000-8000-000000000301
                    - 30000000-0000-4000-8000-000000000302
                    - 30000000-0000-4000-8000-000000000303
