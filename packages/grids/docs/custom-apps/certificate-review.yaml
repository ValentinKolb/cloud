schemaVersion: 5
kind: grids.custom-app
id: c00102
baseId: c00001
name: Certificate review
icon: certificate
startPageId: queue
pages:
  - id: queue
    title: Review queue
    navigation:
      visible: true
      icon: list-check
    parameters: {}
    rows:
      - id: queue
        columns:
          - id: content
            span: 12
            blocks:
              - id: guidance
                type: markdown
                markdown: |
                  ## Certificate requests
                  Review submitted requests and keep questions in the shared discussion.
              - id: requests
                type: records
                title: Open requests
                emptyText: There are no open certificate requests.
                searchable: true
                pageSize: 25
                source:
                  kind: gql
                  query: |
                    from table {c00201}
                    where {c00304} = 'pending'
                    select {c00301}, {c00303}, {c00304}
                    sort record.createdAt asc
                display:
                  kind: table
                  columnIds: []
                rowNavigate:
                  kind: navigate
                  pageId: request
                  history: push
                  params:
                    request_id: { source: ROW, path: id }

  - id: request
    title: Request review
    navigation:
      visible: false
    parameters:
      request_id:
        type: record
        tableId: c00201
        required: true
    record:
      tableId: c00201
      id: { source: PARAMS, path: request_id }
    rows:
      - id: detail
        columns:
          - id: request
            span: 8
            blocks:
              - id: request
                type: record
                title: Certificate request
                fieldIds:
                  - c00301
                  - c00302
                  - c00303
                  - c00304
                editableFieldIds: []
                documents:
                  templateIds:
                    - c00601
          - id: review
            span: 4
            blocks:
              - id: review-actions
                type: actions
                title: Review
                actions:
                  - id: approve
                    label: Approve and generate certificate
                    icon: certificate
                    kind: workflow
                    launcherId: c00802
                    inputs:
                      request: { source: RECORD, path: id }
                    confirm: Approve this request and generate its certificate?
                    availableWhen:
                      query: |
                        from table {c00201}
                        where record.id = @params.request_id and {c00304} = 'pending'
                        limit 1
              - id: comments
                type: comments
                title: Questions and updates
