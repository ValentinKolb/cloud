schemaVersion: 5
kind: grids.custom-app
id: r00101
baseId: r00001
name: Reimbursement requests
icon: receipt
startPageId: submit
pages:
  - id: submit
    title: Submit request
    navigation:
      visible: true
    parameters: {}
    rows:
      - id: submit
        columns:
          - id: content
            span: 12
            blocks:
              - id: guidance
                type: markdown
                markdown: |
                  ## Request reimbursement
                  Start with the purpose, then add each expense and its receipt.
              - id: request-form
                type: form
                formId: r00501
                fixedValues: {}
                onSuccessNavigate:
                  kind: navigate
                  pageId: request
                  params:
                    request_id: { source: RESULT, path: recordId }

  - id: requests
    title: My requests
    navigation:
      visible: true
    parameters: {}
    rows:
      - id: requests
        columns:
          - id: content
            span: 12
            blocks:
              - id: requests
                type: records
                title: My reimbursement requests
                emptyText: You have not submitted a reimbursement request yet.
                searchable: true
                pageSize: 25
                source:
                  kind: view
                  viewId: r00401
                display:
                  kind: table
                  columnIds:
                    - r00301
                    - r00302
                rowNavigate:
                  kind: navigate
                  pageId: request
                  history: push
                  params:
                    request_id: { source: ROW, path: id }

  - id: request
    title: Request detail
    navigation:
      visible: false
    availableWhen:
      query: |
        from table {r00201}
        where record.id = @params.request_id and record.createdBy = @auth.id
        limit 1
    parameters:
      request_id:
        type: record
        tableId: r00201
        required: true
    record:
      tableId: r00201
      id: { source: PARAMS, path: request_id }
    rows:
      - id: request
        columns:
          - id: detail
            span: 8
            blocks:
              - id: request
                type: record
                fieldIds:
                  - r00301
                  - r00302
                editableFieldIds: []
              - id: expenses
                type: records
                title: Expenses
                emptyText: Add the first expense and receipt.
                searchable: true
                pageSize: 25
                source:
                  kind: gql
                  query: |
                    from table {r00202}
                    where {r00311} = @params.request_id
                    select {r00312}, {r00313}, {r00315}
                    sort record.createdAt asc
                display:
                  kind: table
                  columnIds:
                    - r00312
                    - r00313
                    - r00315
                rowNavigate:
                  kind: navigate
                  pageId: expense
                  history: push
                  params:
                    expense_id: { source: ROW, path: id }
          - id: actions
            span: 4
            blocks:
              - id: actions
                type: actions
                actions:
                  - id: add-expense
                    label: Add expense
                    icon: plus
                    kind: navigate
                    pageId: add-expense
                    history: push
                    params:
                      request_id: { source: RECORD, path: id }
              - id: comments
                type: comments
                title: Questions and updates

  - id: add-expense
    title: Add expense
    navigation:
      visible: false
    availableWhen:
      query: |
        from table {r00201}
        where record.id = @params.request_id and record.createdBy = @auth.id
        limit 1
    parameters:
      request_id:
        type: record
        tableId: r00201
        required: true
    record:
      tableId: r00201
      id: { source: PARAMS, path: request_id }
    rows:
      - id: expense
        columns:
          - id: content
            span: 12
            blocks:
              - id: request-context
                type: record
                fieldIds:
                  - r00301
                  - r00302
                editableFieldIds: []
              - id: expense-form
                type: form
                formId: r00502
                fixedValues:
                  r00311: { source: PARAMS, path: request_id }
                onSuccessNavigate:
                  kind: navigate
                  pageId: expense
                  params:
                    expense_id: { source: RESULT, path: recordId }

  - id: expense
    title: Expense detail
    navigation:
      visible: false
    availableWhen:
      query: |
        from table {r00202}
        where record.id = @params.expense_id and record.createdBy = @auth.id
        limit 1
    parameters:
      expense_id:
        type: record
        tableId: r00202
        required: true
    record:
      tableId: r00202
      id: { source: PARAMS, path: expense_id }
    rows:
      - id: expense
        columns:
          - id: content
            span: 12
            blocks:
              - id: expense
                type: record
                title: Expense and receipt
                fieldIds:
                  - r00312
                  - r00313
                  - r00314
                  - r00315
                  - r00316
                editableFieldIds:
                  - r00312
                  - r00313
                  - r00314
                  - r00315
                  - r00316
