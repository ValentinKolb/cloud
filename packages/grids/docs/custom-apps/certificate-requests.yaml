schemaVersion: 5
kind: grids.custom-app
id: c00101
baseId: c00001
name: Certificate requests
icon: certificate
startPageId: apply
pages:
  - id: apply
    title: Apply
    navigation:
      visible: true
    parameters: {}
    rows:
      - id: intro
        columns:
          - id: content
            span: 12
            blocks:
              - id: guidance
                type: markdown
                markdown: |
                  ## Request a certificate
                  Describe the voluntary work the certificate should cover.
              - id: request-form
                type: form
                formId: c00501
                fixedValues: {}
                onSuccessNavigate:
                  kind: navigate
                  pageId: request
                  params:
                    request_id: { source: RESULT, path: recordId }

  - id: requests
    title: My requests
    navigation:
      visible: true
    parameters: {}
    rows:
      - id: list
        columns:
          - id: content
            span: 12
            blocks:
              - id: requests
                type: records
                searchable: true
                pageSize: 25
                title: My requests
                emptyText: You have not submitted a certificate request yet.
                source:
                  kind: view
                  viewId: c00401
                display:
                  kind: table
                  columnIds:
                    - c00301
                    - c00302
                    - c00304
                rowNavigate:
                  kind: navigate
                  pageId: request
                  history: push
                  params:
                    request_id: { source: ROW, path: id }

  - id: request
    title: Request detail
    navigation:
      visible: false
    parameters:
      request_id:
        type: record
        tableId: c00201
        required: true
    record:
      tableId: c00201
      id: { source: PARAMS, path: request_id }
    rows:
      - id: detail
        columns:
          - id: request
            span: 8
            blocks:
              - id: request
                type: record
                fieldIds:
                  - c00301
                  - c00302
                  - c00303
                  - c00304
                editableFieldIds: []
                documents:
                  templateIds:
                    - c00601
          - id: discussion
            span: 4
            blocks:
              - id: comments
                type: comments
