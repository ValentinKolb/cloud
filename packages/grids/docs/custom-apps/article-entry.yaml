schemaVersion: 5
kind: grids.custom-app
id: a00101
baseId: a00001
name: Article descriptions
icon: list-details
startPageId: lists
pages:
  - id: lists
    title: Description lists
    navigation:
      visible: true
    parameters: {}
    rows:
      - id: lists
        columns:
          - id: content
            span: 12
            blocks:
              - id: lists
                type: records
                searchable: true
                pageSize: 25
                source:
                  kind: view
                  viewId: a00401
                display:
                  kind: table
                  columnIds:
                    - a00301
                rowNavigate:
                  kind: navigate
                  pageId: list
                  history: push
                  params:
                    list_id: { source: ROW, path: id }

  - id: list
    title: Description list
    navigation:
      visible: false
    parameters:
      list_id:
        type: record
        tableId: a00201
        required: true
    record:
      tableId: a00201
      id: { source: PARAMS, path: list_id }
    rows:
      - id: list
        columns:
          - id: details
            span: 8
            blocks:
              - id: list
                type: record
                fieldIds:
                  - a00301
                editableFieldIds: []
              - id: articles
                type: records
                searchable: true
                pageSize: 25
                title: Articles
                emptyText: No articles have been added to this list.
                source:
                  kind: gql
                  query: |
                    from table "Articles"
                    select Name, Weight, Description
                    where List = @params.list_id
                    sort record.createdAt asc
                    limit 100
                display:
                  kind: table
                  columnIds:
                    - a00303
                    - a00304
                    - a00305
          - id: actions
            span: 4
            blocks:
              - id: actions
                type: actions
                actions:
                  - id: add-article
                    label: Add article
                    icon: plus
                    kind: navigate
                    pageId: add-article
                    history: push
                    params:
                      list_id: { source: PARAMS, path: list_id }

  - id: add-article
    title: Add article
    navigation:
      visible: false
    parameters:
      list_id:
        type: record
        tableId: a00201
        required: true
    rows:
      - id: entry
        columns:
          - id: content
            span: 12
            blocks:
              - id: article-form
                type: form
                formId: a00501
                fixedValues:
                  a00302: { source: PARAMS, path: list_id }
                onSuccessNavigate:
                  kind: navigate
                  pageId: add-article
                  params:
                    list_id: { source: PARAMS, path: list_id }
              - id: done
                type: actions
                actions:
                  - id: finish
                    label: Finish
                    icon: check
                    kind: navigate
                    pageId: list
                    history: push
                    params:
                      list_id: { source: PARAMS, path: list_id }
