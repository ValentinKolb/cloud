schemaVersion: 5
kind: grids.custom-app
id: r00102
baseId: r00001
name: Reimbursement review
icon: receipt
startPageId: queue
pages:
  - id: queue
    title: Review queue
    navigation:
      visible: true
    parameters: {}
    rows:
      - id: queue
        columns:
          - id: content
            span: 12
            blocks:
              - id: requests
                type: records
                title: Pending reimbursements
                emptyText: There are no pending reimbursement requests.
                searchable: true
                pageSize: 25
                source:
                  kind: gql
                  query: |
                    from table {r00201}
                    where {r00302} = 'pending'
                    select {r00301}, {r00302}
                    sort record.createdAt asc
                display:
                  kind: table
                  columnIds: []
                rowNavigate:
                  kind: navigate
                  pageId: request
                  history: push
                  params:
                    request_id: { source: ROW, path: id }

  - id: request
    title: Reimbursement review
    navigation:
      visible: false
    parameters:
      request_id:
        type: record
        tableId: r00201
        required: true
    record:
      tableId: r00201
      id: { source: PARAMS, path: request_id }
    rows:
      - id: request
        columns:
          - id: detail
            span: 8
            blocks:
              - id: request
                type: record
                fieldIds:
                  - r00301
                  - r00302
                editableFieldIds: []
              - id: expenses
                type: records
                title: Expenses
                searchable: true
                pageSize: 25
                source:
                  kind: gql
                  query: |
                    from table {r00202}
                    where {r00311} = @params.request_id
                    select {r00312}, {r00313}, {r00315}
                    sort record.createdAt asc
                display:
                  kind: table
                  columnIds:
                    - r00312
                    - r00313
                    - r00315
                rowNavigate:
                  kind: navigate
                  pageId: expense
                  history: push
                  params:
                    expense_id: { source: ROW, path: id }
          - id: review
            span: 4
            blocks:
              - id: decisions
                type: actions
                actions:
                  - id: approve
                    label: Approve
                    icon: check
                    kind: workflow
                    launcherId: r00802
                    inputs:
                      request: { source: RECORD, path: id }
                    confirm: Approve this reimbursement request?
                    availableWhen:
                      query: |
                        from table {r00201}
                        where record.id = @params.request_id and {r00302} = 'pending'
                        limit 1
                  - id: reject
                    label: Reject
                    icon: x
                    kind: workflow
                    launcherId: r00804
                    inputs:
                      request: { source: RECORD, path: id }
                    confirm: Reject this reimbursement request?
                    availableWhen:
                      query: |
                        from table {r00201}
                        where record.id = @params.request_id and {r00302} = 'pending'
                        limit 1
              - id: comments
                type: comments
                title: Questions and updates

  - id: expense
    title: Expense receipt
    navigation:
      visible: false
    parameters:
      expense_id:
        type: record
        tableId: r00202
        required: true
    record:
      tableId: r00202
      id: { source: PARAMS, path: expense_id }
    rows:
      - id: expense
        columns:
          - id: content
            span: 12
            blocks:
              - id: expense
                type: record
                title: Expense and receipt
                fieldIds:
                  - r00312
                  - r00313
                  - r00314
                  - r00315
                  - r00316
                editableFieldIds: []
