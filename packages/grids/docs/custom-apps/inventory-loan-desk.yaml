schemaVersion: 2
kind: grids.custom-app
id: 30000000-0000-4000-8000-000000000102
baseId: 30000000-0000-4000-8000-000000000001
name: Loan desk
icon: clipboard-check
startPageId: loans
pages:
  - id: loans
    title: Loans
    navigation:
      visible: true
      order: 10
    parameters: {}
    rows:
      - id: loans
        columns:
          - id: content
            span: 12
            blocks:
              - id: loans
                type: records
                source:
                  kind: view
                  viewId: 30000000-0000-4000-8000-000000000402
                display:
                  kind: table
                  columnIds:
                    - 30000000-0000-4000-8000-000000000306
                    - 30000000-0000-4000-8000-000000000304
                    - 30000000-0000-4000-8000-000000000305
                rowNavigate:
                  kind: navigate
                  pageId: loan
                  history: push
                  params:
                    loan_id: { source: ROW, path: id }

  - id: loan
    title: Loan detail
    navigation:
      visible: false
      order: 20
    parameters:
      loan_id:
        type: record
        tableId: 30000000-0000-4000-8000-000000000201
        required: true
    record:
      tableId: 30000000-0000-4000-8000-000000000201
      id: { source: PARAMS, path: loan_id }
    rows:
      - id: detail
        columns:
          - id: loan
            span: 8
            blocks:
              - id: loan
                type: record
                fieldIds:
                  - 30000000-0000-4000-8000-000000000306
                  - 30000000-0000-4000-8000-000000000304
                  - 30000000-0000-4000-8000-000000000305
                  - 30000000-0000-4000-8000-000000000307
                editableFieldIds: []
                documents:
                  templateIds:
                    - 30000000-0000-4000-8000-000000000601
                    - 30000000-0000-4000-8000-000000000602
              - id: loan-items
                type: records
                source:
                  kind: gql
                  query: |
                    from table "Loan items"
                    select Item, "Condition on return", "Damage note"
                    where Loan = @params.loan_id
                    sort record.createdAt asc
                    limit 100
                  maxRows: 100
                display:
                  kind: table
                  columnIds:
                    - 30000000-0000-4000-8000-000000000308
                    - 30000000-0000-4000-8000-000000000309
                    - 30000000-0000-4000-8000-000000000310
          - id: workflow
            span: 4
            blocks:
              - id: comments
                type: comments
              - id: actions
                type: actions
                actions:
                  - id: approve
                    label: Approve request
                    icon: check
                    kind: workflow
                    launcherId: 30000000-0000-4000-8000-000000000702
                    inputs:
                      loan_id: { source: RECORD, path: id }
                    availableWhen:
                      query: |
                        from table Loans
                        where record.id = @params.loan_id and {30000000-0000-4000-8000-000000000306} = 'Submitted'
                        limit 1
                  - id: record-return
                    label: Record return
                    icon: package-import
                    kind: workflow
                    launcherId: 30000000-0000-4000-8000-000000000703
                    inputs:
                      loan_id: { source: RECORD, path: id }
                    availableWhen:
                      query: |
                        from table Loans
                        where record.id = @params.loan_id and {30000000-0000-4000-8000-000000000306} = 'Active'
                        limit 1
                  - id: adjust-items
                    label: Adjust items
                    icon: packages
                    kind: workflow
                    launcherId: 30000000-0000-4000-8000-000000000706
                    inputs:
                      loan_id: { source: RECORD, path: id }
